package: mimi-app-backup
version: 0.1.0
name: 咪咪应用备份
description: 为当前登录用户发现应用数据并建立受限的备份保护计划
author: dnwwdwd
homepage: https://github.com/dnwwdwd/lazycat-app-snapshot
license: MIT
min_os_version: "1.5.0"

locales:
  zh:
    name: 咪咪应用备份
    description: 为当前登录用户发现应用数据并建立受限的备份保护计划
  zh_CN:
    name: 咪咪应用备份
    description: 为当前登录用户发现应用数据并建立受限的备份保护计划
  en:
    name: Mimi App Backup
    description: Discover current-user application data for protected backups
  ja:
    name: Mimi App Backup
    description: 現在のユーザーのアプリデータを検出し、保護されたバックアップを準備します

permissions:
  required:
    - appvar.other.read
    - document.write
  optional:
    - user.notify
