<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>咪咪应用备份 · V1 原型</title>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    :root {
      --ink: #172b50;
      --ink-2: #2f4b78;
      --ink-3: #60769b;
      --sky: #eef5ff;
      --sky-2: #e2edff;
      --paper: #ffffff;
      --cream: #fbfaf7;
      --line: #dfe8f4;
      --line-strong: #c6d5ea;
      --sun: #ffb844;
      --sun-deep: #e9941d;
      --mint: #43b89f;
      --mint-soft: #ddf4ed;
      --rose: #df6d7e;
      --rose-soft: #ffe6ea;
      --violet: #7e88de;
      --violet-soft: #e9eaff;
      --shadow: 0 16px 40px rgba(35, 58, 99, .08);
      --shadow-sm: 0 5px 18px rgba(35, 58, 99, .08);
      --radius: 20px;
      --radius-sm: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Noto Sans SC", sans-serif;
      color: var(--ink);
      background: var(--sky);
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 0; background: var(--sky); color: var(--ink); }
    button, input, select { font: inherit; }
    button { border: 0; cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid rgba(255, 184, 68, .45); outline-offset: 2px; }
    .app-shell { min-height: 100vh; display: flex; }
    .sidebar { width: 258px; flex: 0 0 258px; background: var(--ink); color: #fff; padding: 22px 15px; display: flex; flex-direction: column; gap: 26px; position: sticky; top: 0; height: 100vh; overflow: hidden; }
    .sidebar::after { content: ""; position: absolute; width: 200px; height: 200px; border-radius: 50%; background: rgba(255,184,68,.12); right: -115px; bottom: 30px; }
    .brand { display: flex; gap: 12px; align-items: center; padding: 3px 10px; position: relative; z-index: 1; }
    .brand-mark { width: 48px; height: 48px; border-radius: 16px; overflow: hidden; background: #f4f8ff; box-shadow: 0 5px 13px rgba(0,0,0,.14); flex: 0 0 auto; }
    .brand-mark img { width: 100%; height: 100%; object-fit: cover; object-position: 47% 43%; }
    .brand-title { font-size: 16px; font-weight: 800; letter-spacing: .02em; }
    .brand-sub { color: #a8bbdb; font-size: 10px; margin-top: 3px; letter-spacing: .08em; text-transform: uppercase; }
    .nav-section { display: grid; gap: 7px; position: relative; z-index: 1; }
    .nav-label { color: #89a0c6; font-size: 10px; text-transform: uppercase; letter-spacing: .16em; padding: 0 12px 3px; }
    .nav-item { min-height: 43px; border-radius: 13px; padding: 0 13px; color: #bac8e1; display: flex; align-items: center; gap: 12px; background: transparent; font-size: 13px; transition: .18s ease; text-align: left; }
    .nav-item:hover { background: rgba(255,255,255,.08); color: #fff; }
    .nav-item.active { background: var(--sun); color: var(--ink); box-shadow: 0 7px 15px rgba(255,184,68,.22); font-weight: 750; }
    .nav-item .nav-count { margin-left: auto; min-width: 22px; height: 20px; border-radius: 10px; padding: 0 6px; display: inline-flex; justify-content: center; align-items: center; background: rgba(255,255,255,.12); font-size: 11px; }
    .nav-item.active .nav-count { background: rgba(23,43,80,.14); }
    .sidebar-footer { margin-top: auto; position: relative; z-index: 1; }
    .tenant-card { padding: 13px; border-radius: 16px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12); }
    .tenant-row { display:flex; align-items:center; gap: 9px; }
    .avatar { width: 33px; height: 33px; border-radius: 50%; display:inline-flex; align-items:center; justify-content:center; font-weight: 800; font-size: 12px; color: var(--ink); background: var(--sun); }
    .tenant-name { font-size: 12px; font-weight: 750; }
    .tenant-uid { color: #a8bbdb; font-size: 10px; margin-top: 3px; }
    .tenant-check { margin-top: 11px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,.12); color: #b4ebdb; font-size: 10px; display: flex; gap: 7px; align-items:center; }
    .main { flex: 1; min-width: 0; }
    .topbar { height: 76px; background: rgba(255,255,255,.82); border-bottom: 1px solid var(--line); display: flex; align-items:center; justify-content: space-between; padding: 0 31px; position: sticky; top: 0; z-index: 20; backdrop-filter: blur(16px); }
    .top-actions { display:flex; align-items:center; gap: 12px; }
    .global-search { width: 286px; height: 38px; border-radius: 12px; border: 1px solid var(--line); background: var(--paper); display:flex; align-items:center; gap: 8px; padding: 0 12px; color: var(--ink-3); }
    .global-search input { width:100%; border:0; outline:0; background: transparent; color: var(--ink); font-size: 12px; }
    .top-btn { width: 36px; height: 36px; border-radius: 11px; background: var(--paper); border: 1px solid var(--line); color: var(--ink-2); display:flex; align-items:center; justify-content:center; position: relative; }
    .top-btn:hover { border-color: var(--sun); color: var(--sun-deep); }
    .alert-dot { width: 7px; height: 7px; border-radius:50%; background: var(--rose); position:absolute; right: 8px; top: 7px; box-shadow:0 0 0 3px var(--paper); }
    .user-menu { display:flex; align-items:center; gap: 8px; padding-left: 7px; border-left: 1px solid var(--line); }
    .user-meta { display: grid; gap: 2px; }
    .user-meta strong { font-size: 12px; }
    .user-meta span { color: var(--ink-3); font-size: 10px; }
    .page { max-width: 1500px; margin: 0 auto; padding: 31px 34px 50px; }
    .page-head { display:flex; justify-content:space-between; align-items:flex-end; gap: 20px; margin-bottom: 24px; }
    .eyebrow { color: var(--sun-deep); font-size: 11px; font-weight: 800; letter-spacing:.15em; text-transform:uppercase; margin-bottom: 8px; }
    h1 { font-size: 29px; letter-spacing: -.03em; margin: 0; line-height:1.16; }
    .page-sub { margin: 8px 0 0; color: var(--ink-3); font-size: 13px; line-height:1.6; }
    .head-actions { display:flex; gap: 10px; align-items:center; }
    .btn { min-height: 38px; padding: 0 15px; border-radius: 11px; display:inline-flex; align-items:center; justify-content:center; gap: 8px; font-size: 12px; font-weight: 750; transition: .18s ease; }
    .btn-primary { background: var(--sun); color: var(--ink); box-shadow: 0 6px 12px rgba(233,148,29,.2); }
    .btn-primary:hover { background: #ffc45c; transform: translateY(-1px); }
    .btn-secondary { background: var(--paper); color: var(--ink-2); border:1px solid var(--line); }
    .btn-secondary:hover { border-color: var(--sun); color: var(--sun-deep); }
    .btn-ghost { background: transparent; color: var(--ink-3); }
    .btn-ghost:hover { background: var(--sky); color: var(--ink); }
    .btn-danger { background: var(--rose-soft); color: #a83b50; }
    .btn-small { min-height: 31px; padding: 0 10px; font-size: 11px; border-radius: 9px; }
    .grid { display:grid; gap: 16px; }
    .stats-grid { display:grid; grid-template-columns: repeat(4, minmax(0,1fr)); margin-bottom: 18px; }
    .stat-card { background: var(--paper); border: 0; border-radius: var(--radius); padding: 18px 18px 16px; box-shadow: var(--shadow-sm); position:relative; overflow:hidden; }
    .stat-top { display:flex; justify-content:space-between; align-items:center; color: var(--ink-3); font-size: 11px; }
    .stat-icon { width: 30px; height: 30px; border-radius: 10px; display:flex; align-items:center; justify-content:center; background: var(--sky); color: var(--ink-2); }
    .stat-value { font-size: 26px; font-weight: 850; letter-spacing: -.04em; margin-top: 12px; }
    .stat-foot { display:flex; gap: 5px; align-items:center; margin-top: 7px; font-size: 10px; color: var(--ink-3); }
    .stat-foot.positive { color: var(--mint); }
    .stat-foot.warning { color: var(--sun-deep); }
    .card { background: var(--paper); border:0; border-radius: var(--radius); box-shadow: var(--shadow-sm); }
    .card-pad { padding: 20px; }
    .card-head { display:flex; align-items:flex-start; justify-content:space-between; gap: 16px; }
    .card-title { font-size: 14px; font-weight: 800; }
    .card-caption { color: var(--ink-3); font-size: 11px; margin-top: 5px; line-height: 1.55; }
    .icon-btn { width: 30px; height: 30px; border-radius: 9px; background: var(--sky); color: var(--ink-2); display:flex; align-items:center; justify-content:center; }
    .icon-btn:hover { background: var(--sky-2); }
    .two-col { grid-template-columns: minmax(0, 1.6fr) minmax(280px, .8fr); align-items:start; }
    .app-hero { background: var(--ink); border-radius: var(--radius); padding: 20px 21px; color: #fff; display:flex; justify-content:space-between; gap: 20px; align-items:center; overflow:hidden; position:relative; margin-bottom: 18px; }
    .app-hero::before { content:""; position:absolute; width:230px; height:230px; border-radius:50%; background: rgba(255,184,68,.12); right: 8%; top:-150px; }
    .app-hero::after { content:""; position:absolute; width:150px; height:150px; border-radius:50%; background: rgba(126,136,222,.17); right:-35px; bottom:-90px; }
    .hero-copy, .hero-side { position:relative; z-index:1; }
    .hero-copy h2 { margin:0; font-size: 20px; letter-spacing:-.03em; }
    .hero-copy p { margin: 7px 0 0; color: #b8c7e1; font-size: 12px; max-width: 600px; line-height:1.6; }
    .hero-badges { display:flex; gap: 7px; margin-top: 13px; flex-wrap:wrap; }
    .hero-badge { background: rgba(255,255,255,.1); color:#dbe5f5; border-radius: 99px; padding: 6px 9px; display:inline-flex; gap:6px; align-items:center; font-size:10px; }
    .hero-badge strong { color: var(--sun); }
    .cat-peek { width: 70px; height: 70px; border-radius: 22px; overflow:hidden; border: 3px solid rgba(255,255,255,.18); background: #eaf1ff; box-shadow: 0 9px 20px rgba(0,0,0,.2); transform: rotate(4deg); }
    .cat-peek img { width:100%; height:100%; object-fit:cover; object-position:48% 30%; }
    .toolbar { padding: 14px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap: 12px; }
    .toolbar-left, .toolbar-right { display:flex; align-items:center; gap:8px; }
    .searchbox { height: 35px; width: 245px; border:1px solid var(--line); border-radius: 10px; display:flex; align-items:center; gap:8px; padding:0 10px; color:var(--ink-3); background:var(--cream); }
    .searchbox input { min-width:0; width:100%; border:0; outline:0; background:transparent; font-size:11px; color:var(--ink); }
    .filter-select { height: 35px; border:1px solid var(--line); border-radius: 10px; background:var(--cream); color:var(--ink-2); font-size:11px; padding: 0 9px; }
    .tabs { display:flex; gap: 4px; padding: 12px 16px 0; overflow:auto; }
    .tab { padding: 8px 10px; border-radius: 9px 9px 0 0; background:transparent; color:var(--ink-3); font-size:11px; white-space:nowrap; border-bottom: 2px solid transparent; }
    .tab:hover { color:var(--ink); }
    .tab.active { color: var(--ink); font-weight:800; background:var(--sky); border-bottom-color: var(--sun); }
    .table-wrap { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; min-width: 720px; }
    th { color: var(--ink-3); font-size: 10px; font-weight:700; text-align:left; padding: 12px 14px; background:#fbfcff; border-top:1px solid var(--line); border-bottom:1px solid var(--line); white-space:nowrap; }
    td { padding: 13px 14px; border-bottom:1px solid #edf1f7; font-size:11px; vertical-align:middle; }
    tr:last-child td { border-bottom:0; }
    tbody tr:hover { background:#fcfdff; }
    .check { width: 15px; height: 15px; accent-color: var(--sun-deep); }
    .app-cell { display:flex; gap:10px; align-items:center; min-width: 195px; }
    .app-avatar { width: 34px; height: 34px; border-radius: 11px; display:flex; align-items:center; justify-content:center; font-weight:850; font-size: 12px; color:#fff; box-shadow: inset 0 -4px 8px rgba(0,0,0,.12); }
    .app-name { font-weight:800; color:var(--ink); }
    .app-id { color:var(--ink-3); font-size:10px; margin-top:3px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .subtle { color: var(--ink-3); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size:10px; }
    .pill { display:inline-flex; align-items:center; gap:5px; border-radius:999px; padding:5px 8px; font-size:10px; white-space:nowrap; font-weight:750; }
    .pill.good { background:var(--mint-soft); color:#247f6e; }
    .pill.warn { background:#fff1d4; color:#a76a0b; }
    .pill.bad { background:var(--rose-soft); color:#a83b50; }
    .pill.neutral { background:#edf1f7; color:#61718d; }
    .pill.violet { background:var(--violet-soft); color:#5e68bb; }
    .mode { display:inline-flex; align-items:center; gap:5px; color:var(--ink-2); font-size:10px; }
    .mode-dot { width:6px; height:6px; border-radius:50%; background:var(--violet); }
    .mode.shared .mode-dot { background: var(--sun-deep); }
    .row-actions { display:flex; gap:4px; justify-content:flex-end; }
    .row-actions .icon-btn { background: transparent; border: 1px solid transparent; }
    .row-actions .icon-btn:hover { border-color:var(--line); background:var(--sky); }
    .bulk-bar { position: sticky; bottom: 16px; margin: 13px 16px 0; padding: 10px 12px; background: var(--ink); border-radius: 13px; display:flex; align-items:center; justify-content:space-between; gap:12px; color:#fff; box-shadow: 0 12px 24px rgba(23,43,80,.25); z-index: 4; }
    .bulk-copy { font-size:11px; display:flex; align-items:center; gap:8px; }
    .bulk-copy strong { color:var(--sun); }
    .bulk-actions { display:flex; gap:7px; }
    .bulk-actions .btn-secondary { background: rgba(255,255,255,.1); color:#fff; border-color:rgba(255,255,255,.2); }
    .radar { padding: 20px; }
    .ring-wrap { display:flex; justify-content:center; padding: 17px 0 19px; }
    .ring { width: 152px; height:152px; border-radius:50%; background: conic-gradient(var(--mint) 0deg 190deg, var(--sun) 190deg 260deg, var(--rose) 260deg 320deg, var(--violet) 320deg 360deg); display:flex; align-items:center; justify-content:center; position:relative; }
    .ring::after { content:""; width: 112px; height:112px; border-radius:50%; background:var(--paper); position:absolute; }
    .ring-center { position:relative; z-index:1; text-align:center; }
    .ring-center strong { display:block; font-size:26px; line-height:1; }
    .ring-center span { color:var(--ink-3); font-size:10px; margin-top:5px; display:block; }
    .legend { display:grid; gap: 11px; }
    .legend-item { display:flex; align-items:center; justify-content:space-between; color:var(--ink-2); font-size:11px; }
    .legend-label { display:flex; align-items:center; gap:8px; }
    .legend-dot { width:8px; height:8px; border-radius:50%; }
    .risk-box { margin-top: 19px; border-radius:13px; background:#fff8ec; border:1px solid #f8dfac; padding:13px; }
    .risk-title { color:#9d6810; font-size:11px; font-weight:800; display:flex; align-items:center; gap:6px; }
    .risk-list { display:grid; gap:9px; margin-top:10px; }
    .risk-item { display:flex; gap:8px; color:#876d3c; font-size:10px; line-height:1.45; }
    .dot-pulse { width:7px; height:7px; border-radius:50%; background:var(--sun-deep); margin-top:3px; flex:0 0 auto; }
    .mini-list { display:grid; gap: 4px; margin-top:15px; }
    .mini-row { display:flex; align-items:center; justify-content:space-between; padding: 10px 0; border-top:1px solid var(--line); gap: 10px; }
    .mini-main { display:flex; align-items:center; gap:9px; min-width:0; }
    .mini-icon { width:28px; height:28px; border-radius:9px; background:var(--sky); color:var(--ink-2); display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
    .mini-name { font-size:11px; font-weight:750; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .mini-meta { color:var(--ink-3); font-size:10px; margin-top:3px; }
    .progress { height:7px; border-radius: 99px; background: #ecf0f6; overflow:hidden; }
    .progress > span { display:block; height:100%; border-radius:inherit; background:linear-gradient(90deg, var(--sun), #ffd581); }
    .chart { height: 118px; display:flex; align-items:flex-end; gap: 7px; padding: 14px 3px 0; }
    .bar { flex:1; background: #dce7fb; border-radius: 6px 6px 2px 2px; position:relative; min-width:12px; }
    .bar.active { background: var(--sun); }
    .bar::after { content:""; position:absolute; bottom:-16px; left:50%; transform:translateX(-50%); color:var(--ink-3); font-size:8px; }
    .bar:nth-child(1)::after { content:"周一"; } .bar:nth-child(2)::after { content:"周二"; } .bar:nth-child(3)::after { content:"周三"; } .bar:nth-child(4)::after { content:"周四"; } .bar:nth-child(5)::after { content:"周五"; } .bar:nth-child(6)::after { content:"周六"; } .bar:nth-child(7)::after { content:"今天"; }
    .activity { display:grid; gap:0; margin-top: 12px; }
    .activity-item { display:grid; grid-template-columns: 26px 1fr auto; gap: 9px; padding: 11px 0; border-top:1px solid var(--line); align-items:start; }
    .activity-icon { width:26px; height:26px; border-radius:9px; background:var(--mint-soft); color:var(--mint); display:flex; align-items:center; justify-content:center; }
    .activity-text { font-size:11px; line-height:1.4; }
    .activity-text strong { font-weight:800; }
    .activity-time { color:var(--ink-3); font-size:10px; white-space:nowrap; }
    .dashboard-grid { grid-template-columns: minmax(0,1.3fr) minmax(0, .9fr); align-items:start; }
    .overview-hero { padding:22px; border-radius: var(--radius); background: linear-gradient(135deg, #fffdf9, #fff5dd); border:0; display:flex; align-items:center; justify-content:space-between; gap: 16px; overflow:hidden; position:relative; }
    .overview-hero::after { content:""; position:absolute; right:-55px; bottom:-85px; width:230px; height:230px; border-radius:50%; background:rgba(255,184,68,.23); }
    .overview-hero h2 { margin:0; font-size:22px; letter-spacing:-.03em; }
    .overview-hero p { margin:8px 0 0; color:#806a42; font-size:12px; line-height:1.6; max-width:550px; }
    .hero-cat-large { width:104px; height:104px; border-radius: 32px; transform: rotate(6deg); overflow:hidden; box-shadow: 0 12px 25px rgba(112,76,22,.16); background:#eaf2ff; position:relative; z-index:1; border: 4px solid #fff8e8; }
    .hero-cat-large img { width:100%; height:100%; object-fit:cover; object-position:47% 29%; }
    .metric-strip { display:flex; gap: 8px; margin-top:13px; flex-wrap:wrap; }
    .metric-chip { border-radius: 99px; padding: 7px 9px; background:rgba(255,255,255,.75); border:1px solid rgba(236,204,137,.8); color:#7c6338; font-size:10px; }
    .metric-chip strong { color:var(--ink); }
    .queue-row { display:grid; grid-template-columns: 8px 1fr auto; gap:9px; align-items:center; padding:10px 0; border-top:1px solid var(--line); }
    .queue-dot { width:8px; height:8px; border-radius:50%; background:var(--sun); }
    .queue-row strong { font-size:11px; }
    .queue-row span { display:block; color:var(--ink-3); font-size:10px; margin-top:2px; }
    .queue-state { font-size:10px; color:var(--ink-3); }
    .plan-card { display:grid; grid-template-columns: 1.35fr 1fr .8fr auto; gap:12px; align-items:center; padding: 15px 17px; border-top:1px solid var(--line); }
    .plan-card:first-child { border-top:0; }
    .plan-card strong { font-size:12px; }
    .plan-meta { color:var(--ink-3); font-size:10px; margin-top:4px; }
    .toggle { width:37px; height:21px; border-radius:99px; padding:3px; background:#cbd7e8; transition:.2s; }
    .toggle.on { background:var(--mint); }
    .toggle span { display:block; width:15px; height:15px; border-radius:50%; background:#fff; transition:.2s; box-shadow:0 1px 3px rgba(0,0,0,.15); }
    .toggle.on span { transform:translateX(16px); }
    .section-label { color:var(--ink-3); font-size:10px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; margin: 24px 0 11px; }
    .stepper { display:flex; gap: 0; margin: 2px 0 22px; }
    .step { flex:1; display:flex; align-items:center; gap:8px; color:var(--ink-3); font-size:10px; position:relative; }
    .step:not(:last-child)::after { content:""; height:1px; background:var(--line-strong); flex:1; margin:0 8px; }
    .step-num { width:25px; height:25px; border-radius:50%; border:1px solid var(--line-strong); display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:800; background:var(--paper); }
    .step.active { color:var(--ink); font-weight:800; }
    .step.active .step-num { background:var(--sun); border-color:var(--sun); color:var(--ink); }
    .step.done .step-num { background:var(--mint-soft); border-color:var(--mint); color:#247f6e; }
    .form-grid { display:grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .field { display:grid; gap:7px; }

        <div className="app-hero"><div className="hero-copy"><h2>林墨，今天的应用也有猫猫在守护。</h2><p>可备份实例会进入有界任务队列；单实例会在首次操作前提醒共享目录风险，服务型数据库会被安全阻断。</p><div className="hero-badges"><span className="hero-badge"><Icon name="shield" size={12}/><strong>OIDC 已校验</strong> tenant_uid: uid-linmo-1001</span><span className="hero-badge"><Icon name="harddrive" size={12}/>网盘剩余 61.6 GB</span><span className="hero-badge"><Icon name="lock" size={12}/>应用层只读</span></div></div><div className="hero-side"><div className="cat-peek"><img src="assets/lzc-icon.png" alt="懒猫文件夹"/></div></div></div>

btn-secondary')} onClick={()=>setFreq('hourly')}>每小时</button><button className={'btn '+(freq==='daily'?'btn-primary':'btn-secondary')} onClick={()=>setFreq('daily')}>每天</button><button className={'btn '+(freq==='weekly'?'btn-primary':'btn-secondary')} onClick={()=>setFreq('weekly')}>每周</button></div></div>{freq!=='manual'&&<div className="form-grid" style={{marginTop:14}}><div className="field"><label>时间</label><input type="time" defaultValue="02:00"/></div><div className="field"><label>时区</label><Dropdown defaultValue="Asia/Shanghai" options={['Asia/Shanghai','UTC']} aria-label="时区" /></div></div>}<div className="notice" style={{marginTop:14}}><Icon name="clock" size={14}/><span>未来五次：明天 02:00、后天 02:00、08-30 02:00、08-31 02:00、09-01 02:00</span></div></>}{step===3&&<><div className="form-grid"><div className="field"><label>最近保留</label><Dropdown defaultValue="7" options={[{label:'最近 3 份',value:'3'},{label:'最近 7 份',value:'7'},{label:'最近 14 份',value:'14'}]} aria-label="最近保留" /></div><div className="field"><label>每周保留</label><Dropdown defaultValue="4" options={['4 周','8 周','12 周']} aria-label="每周保留" /></div><div className="field"><label>回收站宽限期</label><Dropdown defaultValue="7" options={['7 天','14 天','30 天']} aria-label="回收站宽限期" /></div><div className="field"><label>失败快照</label><Dropdown defaultValue="keep" options={[{label:'暂停清理',value:'keep'},{label:'移入回收站',value:'trash'}]} aria-label="失败快照" /></div></div><div className="notice good" style={{marginTop:14}}><Icon name="shield" size={14}/><span>系统会至少保留 1 份校验通过的快照。校验失败时自动暂停删除。</span></div></>}{step===4&&<><div className="notice good"><Icon name="check" size={14}/><span>计划配置已就绪，保存后会创建一个批次任务。</span></div><div className="mini-list"><div className="mini-row"><span className="subtle">目标</span><strong>{targetList.map(t=>t.name).join('、')}</strong></div><div className="mini-row"><span className="subtle">频率</span><strong>{freq==='manual'?'仅手动':freq==='hourly'?'每小时':freq==='weekly'?'每周一 02:00':'每天 02:00'}</strong></div><div className="mini-row"><span className="subtle">保留</span><strong>最近 7 份 / 每周 4 份</strong></div><div className="mini-row"><span className="subtle">通知</span><strong>首次失败、连续失败升级、空间不足</strong></div></div></>}</div><div className="modal-foot"><button className="btn btn-secondary" onClick={()=>step===1?close():setStep(step-1)}>{step===1?'取消':'上一步'}</button>{step<4?<button className="btn btn-primary" onClick={()=>setStep(step+1)} disabled={step===1&&targetList.some(t=>t.mode==='single')&&!confirm}>下一步 <Icon name="arrow" size={13}/></button>:<><button className="btn btn-secondary" onClick={()=>{showToast('计划已保存','下一次执行时间已加入概览。');close()}}>仅保存</button><button className="btn btn-primary" onClick={()=>{showToast('计划已保存并执行','批次已进入有界工作池。');close()}}>保存并立即执行</button></>}</div></div></div> }

    function PlanModalSingle({ targets, close, showToast }) {
      const [planName, setPlanName] = useState('Notus 夜间守护');
      const [freq, setFreq] = useState('daily');
      const [backupTime, setBackupTime] = useState('02:00');
      const [timezone, setTimezone] = useState('Asia/Shanghai');
      const [retention, setRetention] = useState('7');
      const [weeklyRetention, setWeeklyRetention] = useState('4');
      const [gracePeriod, setGracePeriod] = useState('7');
      const [failedSnapshot, setFailedSnapshot] = useState('keep');
      const [confirm, setConfirm] = useState(false);
      const [notify, setNotify] = useState({ first: true, repeat: true, space: true });
      const [errors, setErrors] = useState({});
      const targetList = targets && targets.length ? targets : applications.filter(a=>a.status.includes('BACKUPABLE')).slice(0,1);
      const needsConfirm = targetList.some(t=>t.mode==='single');
      const updateNotify = key => setNotify(prev => ({...prev, [key]: !prev[key]}));
      const clearError = key => setErrors(prev => prev[key] ? ({...prev, [key]: undefined}) : prev);
      const validate = () => {
        const next = {};
        if (!planName.trim()) next.planName = '请输入计划名称';
        if (!targetList.length) next.target = '至少选择一个可备份实例';
        if (!freq) next.freq = '请选择执行频率';
        if (freq !== 'manual' && !backupTime) next.time = '请选择执行时间';
        if (freq !== 'manual' && !timezone) next.timezone = '请选择时区';
        if (!retention) next.retention = '请选择最近保留份数';
        if (!weeklyRetention) next.weeklyRetention = '请选择每周保留周期';
        if (!gracePeriod) next.gracePeriod = '请选择回收站宽限期';
        if (needsConfirm && !confirm) next.confirm = '请先确认单实例共享数据风险';
        setErrors(next);
        if (Object.keys(next).length) {
          showToast('请完善必填字段', Object.values(next)[0]);
          return false;
        }
        return true;
      };
      const save = runNow => {
        if (!validate()) return;
        showToast(runNow?'计划已保存并执行':'计划已保存', runNow?'批次已进入有界工作池。':'下一次执行时间已加入概览。');
        close();
      };
      const fieldLabel = (label, required = false) => <>{label}{required && <span className="required-mark">*</span>}</>;
      return <div className="modal-backdrop" onMouseDown={e=>e.target===e.currentTarget&&close()}><div className="modal plan-modal"><div className="modal-head"><div><div className="eyebrow" style={{marginBottom:6}}>New plan · 一次配置</div><div className="modal-title">新建备份计划</div><div className="modal-copy">在一个窗口里完成目标、频率、时间、保留和通知策略。</div></div><button className="icon-btn" onClick={close}><Icon name="close" size={15}/></button></div><div className="modal-body">
        <div className={'field '+(errors.planName?'has-error':'')}><label>{fieldLabel('计划名称', true)}</label><input value={planName} onChange={e=>{setPlanName(e.target.value);clearError('planName')}} placeholder="例如：Notus 夜间守护" required aria-required="true" />{errors.planName&&<span className="field-error">{errors.planName}</span>}</div>
        <div className={'field '+(errors.target?'has-error':'')}><label>{fieldLabel('目标实例', true)}</label><div className={'plan-target-list '+(!targetList.length?'is-empty':'')}>{targetList.length?targetList.map(t=><div className="setting-row" key={t.id}><div style={{display:'flex',alignItems:'center',gap:8}}><AppIcon app={t}/><div><strong>{t.name}</strong><p className="mono">{t.deploy} · {t.size}</p></div></div><StatusPill status={t.status}/></div>):<span>当前没有可备份的应用实例</span>}</div>{errors.target&&<span className="field-error">{errors.target}</span>}</div>
        <div className={'field '+(errors.freq?'has-error':'')}><label>{fieldLabel('执行频率', true)}</label><div className="frequency-grid">{[['manual','仅手动'],['hourly','每小时'],['daily','每天'],['weekly','每周']].map(([id,label])=><button type="button" key={id} className={'btn '+(freq===id?'btn-primary':'btn-secondary')} onClick={()=>{setFreq(id);setErrors(prev=>({...prev,freq:undefined,time:undefined,timezone:undefined}))}}>{label}</button>)}</div>{errors.freq&&<span className="field-error">{errors.freq}</span>}</div>
        {freq!=='manual'&&<div className="plan-form-grid plan-form-grid-compact"><div className={'field '+(errors.time?'has-error':'')}><label>{fieldLabel('执行时间', true)}</label><input type="time" value={backupTime} onChange={e=>{setBackupTime(e.target.value);clearError('time')}} required aria-required="true" />{errors.time&&<span className="field-error">{errors.time}</span>}</div><div className={'field '+(errors.timezone?'has-error':'')}><label>{fieldLabel('时区', true)}</label><Dropdown value={timezone} onChange={e=>{setTimezone(e.target.value);clearError('timezone')}} options={['Asia/Shanghai','UTC']} aria-label="时区" required />{errors.timezone&&<span className="field-error">{errors.timezone}</span>}</div></div>}
        {freq!=='manual'&&<div className="notice"><Icon name="clock" size={14}/><span>未来五次：明天 02:00、后天 02:00、08-30 02:00、08-31 02:00、09-01 02:00</span></div>}
        <div className="field"><label>保留策略</label><div className="form-grid"><div className={'field '+(errors.retention?'has-error':'')}><label>{fieldLabel('最近保留', true)}</label><Dropdown value={retention} onChange={e=>{setRetention(e.target.value);clearError('retention')}} options={[{label:'最近 3 份',value:'3'},{label:'最近 7 份',value:'7'},{label:'最近 14 份',value:'14'}]} aria-label="最近保留" required />{errors.retention&&<span className="field-error">{errors.retention}</span>}</div><div className={'field '+(errors.weeklyRetention?'has-error':'')}><label>{fieldLabel('每周保留', true)}</label><Dropdown value={weeklyRetention} onChange={e=>{setWeeklyRetention(e.target.value);clearError('weeklyRetention')}} options={[{label:'4 周',value:'4'},{label:'8 周',value:'8'},{label:'12 周',value:'12'}]} aria-label="每周保留" required />{errors.weeklyRetention&&<span className="field-error">{errors.weeklyRetention}</span>}</div><div className={'field '+(errors.gracePeriod?'has-error':'')}><label>{fieldLabel('回收站宽限期', true)}</label><Dropdown value={gracePeriod} onChange={e=>{setGracePeriod(e.target.value);clearError('gracePeriod')}} options={[{label:'7 天',value:'7'},{label:'14 天',value:'14'},{label:'30 天',value:'30'}]} aria-label="回收站宽限期" required />{errors.gracePeriod&&<span className="field-error">{errors.gracePeriod}</span>}</div><div className="field"><label>失败快照</label><Dropdown value={failedSnapshot} onChange={e=>setFailedSnapshot(e.target.value)} options={[{label:'暂停清理',value:'keep'},{label:'移入回收站',value:'trash'}]} aria-label="失败快照" /></div></div></div>
        <div className="notice good"><Icon name="shield" size={14}/><span>系统会至少保留 1 份校验通过的快照；校验失败时自动暂停删除。</span></div>
        <div className="field"><label>通知</label><div className="notification-options"><label className="notification-option"><input className="check" type="checkbox" checked={notify.first} onChange={()=>updateNotify('first')} /><span className="notification-option-copy"><strong>首次失败</strong><small>任务第一次失败时提醒</small></span></label><label className="notification-option"><input className="check" type="checkbox" checked={notify.repeat} onChange={()=>updateNotify('repeat')} /><span className="notification-option-copy"><strong>连续失败升级</strong><small>连续 3 次失败升级告警</small></span></label><label className="notification-option"><input className="check" type="checkbox" checked={notify.space} onChange={()=>updateNotify('space')} /><span className="notification-option-copy"><strong>空间不足</strong><small>网盘达到阈值时提醒</small></span></label></div></div>
        {needsConfirm&&<div className={'field '+(errors.confirm?'has-error':'')}><label className="checkline"><input className="check" type="checkbox" checked={confirm} onChange={e=>{setConfirm(e.target.checked);setErrors(prev=>({...prev,confirm:undefined}))}} required={needsConfirm} aria-required="true" />我已了解单实例共享数据风险<span className="required-mark">*</span></label>{errors.confirm&&<span className="field-error">{errors.confirm}</span>}</div>}
      </div><div className="modal-foot"><button className="btn btn-secondary" onClick={close}>取消</button><button className="btn btn-secondary" onClick={()=>save(false)}>仅保存</button><button className="btn btn-primary" onClick={()=>save(true)}>保存并立即执行</button></div></div></div>;
    }
    function PlanModalSingleLegacy({ targets, close, showToast }) {
      const [freq,setFreq] = useState('daily');
      const [confirm,setConfirm] = useState(false);
      const targetList = targets && targets.length ? targets : applications.filter(a=>a.status.includes('BACKUPABLE')).slice(0,1);
      const needsConfirm = targetList.some(t=>t.mode==='single');
      const frequencyLabel = { manual:'仅手动', hourly:'每小时', daily:'每天 02:00', weekly:'每周一 02:00' };
      const save = (runNow=false) => { showToast(runNow?'计划已保存并执行':'计划已保存', runNow?'批次已进入有界工作池。':'下一次执行时间已加入概览。'); close(); };
      return <div className="modal-backdrop" onMouseDown={e=>e.target===e.currentTarget&&close()}><div className="modal plan-modal"><div className="modal-head"><div><div className="eyebrow" style={{marginBottom:6}}>New plan · 一次配置</div><div className="modal-title">新建备份计划</div><div className="modal-copy">在一个窗口里完成目标、频率、保留和通知策略。</div></div><button className="icon-btn" onClick={close}><Icon name="close" size={15}/></button></div><div className="modal-body"><div className="plan-form-grid"><div className="field"><label>计划名称</label><input defaultValue="Notus 夜间守护" /></div><div className="field"><label>执行频率</label><div className="frequency-grid">{[['manual','仅手动'],['hourly','每小时'],['daily','每天'],['weekly','每周']].map(([id,label])=><button key={id} className={'btn '+(freq===id?'btn-primary':'btn-secondary')} onClick={()=>setFreq(id)}>{label}</button>)}</div></div></div><div className="field plan-field"><label>目标实例</label><div className="plan-target-list">{targetList.map(t=><div className="setting-row" key={t.id}><div style={{display:'flex',alignItems:'center',gap:8}}><AppIcon app={t}/><div><strong>{t.name}</strong><p className="mono">{t.deploy} · {t.size}</p></div></div><StatusPill status={t.status}/></div>)}</div></div>{needsConfirm&&<label className="checkline plan-risk-check"><input className="check" type="checkbox" checked={confirm} onChange={e=>setConfirm(e.target.checked)}/>我已了解单实例共享数据风险</label>}{freq!=='manual'&&<><div className="plan-form-grid plan-form-grid-compact"><div className="field"><label>时间</label><input type="time" defaultValue="02:00" /></div><div className="field"><label>时区</label><Dropdown defaultValue="Asia/Shanghai" options={['Asia/Shanghai','UTC']} aria-label="时区" /></div></div><div className="notice plan-field"><Icon name="clock" size={14}/><span>未来五次：明天 02:00、后天 02:00、08-30 02:00、08-31 02:00、09-01 02:00</span></div></>}<div className="field plan-field"><label>保留策略</label><div className="form-grid"><div className="field"><label>最近保留</label><Dropdown defaultValue="7" options={[{label:'最近 3 份',value:'3'},{label:'最近 7 份',value:'7'},{label:'最近 14 份',value:'14'}]} aria-label="最近保留" /></div><div className="field"><label>每周保留</label><Dropdown defaultValue="4" options={['4 周','8 周','12 周']} aria-label="每周保留" /></div><div className="field"><label>回收站宽限期</label><Dropdown defaultValue="7" options={['7 天','14 天','30 天']} aria-label="回收站宽限期" /></div><div className="field"><label>失败快照</label><Dropdown defaultValue="keep" options={[{label:'暂停清理',value:'keep'},{label:'移入回收站',value:'trash'}]} aria-label="失败快照" /></div></div></div><div className="notice good plan-field"><Icon name="shield" size={14}/><span>系统会至少保留 1 份校验通过的快照；校验失败时自动暂停删除。</span></div><div className="field plan-field"><label>通知</label><div className="notification-options"><label className="checkline"><input className="check" type="checkbox" defaultChecked/>首次失败</label><label className="checkline"><input className="check" type="checkbox" defaultChecked/>连续失败升级</label><label className="checkline"><input className="check" type="checkbox" defaultChecked/>空间不足</label></div></div></div><div className="modal-foot"><button className="btn btn-secondary" onClick={close}>取消</button><button className="btn btn-secondary" onClick={()=>save(false)} disabled={needsConfirm&&!confirm}>仅保存</button><button className="btn btn-primary" onClick={()=>save(true)} disabled={needsConfirm&&!confirm}>保存并立即执行</button></div></div></div>;
    }

    function TaskDrawer({ name, close }) { return <div className="drawer-backdrop" onMouseDown={e=>e.target===e.currentTarget&&close()}><aside className="drawer"><div className="drawer-head"><div><div className="drawer-title">任务详情</div><div className="drawer-sub">{name} · job-0827-0200</div></div><button className="icon-btn" onClick={close}><Icon name="close" size={15}/></button></div><div className="drawer-body"><div className="notice good"><Icon name="check" size={14}/><span>任务已完成，snapshot.zip 与 manifest.json 已提交到当前用户网盘。</span></div><div className="section-label">阶段时间线</div><div className="activity"><div className="activity-item"><div className="activity-icon"><Icon name="check" size={13}/></div><div className="activity-text"><strong>入队 / 获取租约</strong><br/><span className="subtle">确认实例锁 · 未发现并发任务</span></div><div className="activity-time">02:00:02</div></div><div className="activity-item"><div className="activity-icon"><Icon name="check" size={13}/></div><div className="activity-text"><strong>扫描与数据库检测</strong><br/><span className="subtle">1,420 文件 · SQLite × 2</span></div><div className="activity-time">02:00:27</div></div><div className="activity-item"><div className="activity-icon"><Icon name="check" size={13}/></div><div className="activity-text"><strong>SQLite 在线快照</strong><br/><span className="subtle">quick_check 通过</span></div><div className="activity-time">02:01:44</div></div><div className="activity-item"><div className="activity-icon"><Icon name="check" size={13}/></div><div className="activity-text"><strong>ZIP + SHA-256 + manifest</strong><br/><span className="subtle">188 MB · 4b22…e91a</span></div><div className="activity-time">02:03:14</div></div></div><div className="section-label">输出路径</div><div className="tree"><div className="folder">LazycatAppBackup/</div><div>└── <span className="folder">20260827T020000.000Z/</span></div><div>    └── <span className="folder">dep-notus-8839a/</span></div><div>        ├── <span className="file">snapshot.zip</span></div><div>        └── <span className="file">manifest.json</span></div></div><div style={{display:'flex',gap:8,marginTop:18}}><button className="btn btn-secondary" style={{flex:1}}><Icon name="download" size={13}/>导出诊断摘要</button><button className="btn btn-primary" style={{flex:1}}>重新校验</button></div></div></aside></div> }
    function SnapshotDrawer({ snap, close, showToast }) { return <div className="drawer-backdrop" onMouseDown={e=>e.target===e.currentTarget&&close()}><aside className="drawer"><div className="drawer-head"><div><div className="drawer-title">{snap.app}</div><div className="drawer-sub">快照详情 · {snap.time}</div></div><button className="icon-btn" onClick={close}><Icon name="close" size={15}/></button></div><div className="drawer-body"><div style={{display:'flex',gap:7}}><StatusPill status={snap.integrity}/><ModePill mode={snap.mode}/></div><div className="section-label">快照信息</div><div className="card card-pad" style={{boxShadow:'none'}}><div className="setting-row"><div><strong>相对路径</strong><p className="mono">LazycatAppBackup/20260827T020000.000Z/{snap.deploy}/</p></div><Icon name="folder" size={14}/></div><div className="setting-row"><div><strong>snapshot.zip</strong><p>{snap.zip} · SHA-256 {snap.sha}</p></div><span className="pill good">存在</span></div><div className="setting-row"><div><strong>manifest.json</strong><p>status = completed · archive_sha256 一致</p></div><span className="pill good">有效</span></div></div><div className="section-label">文件索引摘要</div><div className="tree"><div className="folder">appvar/</div><div>├── <span className="folder">config/</span> <span className="subtle">(34 files)</span></div><div>├── <span className="folder">attachments/</span> <span className="subtle">(1,120 files)</span></div><div>├── <span className="folder">indexes/</span> <span className="subtle">(264 files)</span></div><div>└── <span className="file">_snapshot/file-index.jsonl</span></div></div><p className="card-caption" style={{marginTop:8}}>V1 不在线展示文件正文，只提供路径、大小、修改时间与可选 SHA-256。</p><div className="section-label">操作</div><div className="form-grid"><button className="btn btn-secondary" onClick={()=>showToast('快速校验已完成','ZIP 大小、SHA-256 与内部 manifest 一致。')}><Icon name="shield" size={13}/>快速校验</button><button className="btn btn-secondary" onClick={()=>showToast('完整校验已加入队列','会遍历 CRC 并检查 SQLite quick_check。')}><Icon name="refresh" size={13}/>完整校验</button><button className="btn btn-secondary" onClick={()=>showToast('导出已加入队列','将解压到当前用户网盘的 _restore_exports。')}><Icon name="download" size={13}/>导出到恢复目录</button><button className="btn btn-danger" onClick={()=>showToast('已移入回收站','快照会在宽限期后物理删除。')}><Icon name="archive" size={13}/>移入回收站</button></div></div></aside></div> }

    function RiskModal({ target, close, onContinue }) { return <div className="modal-backdrop" onMouseDown={e=>e.target===e.currentTarget&&close()}><div className="modal"><div className="modal-head"><div><div className="risk-illustration"><Icon name="warning" size={25}/></div><div className="modal-title">确认单实例共享风险</div><div className="modal-copy">{target.length>1?'所选目标中包含单实例应用。':'该应用使用单实例运行，应用内部可能保存共享数据。'}</div></div><button className="icon-btn" onClick={close}><Icon name="close" size={15}/></button></div><div className="modal-body"><div className="notice warn"><Icon name="lock" size={14}/><span>当前备份范围以懒猫平台向本账号开放的数据目录为准。备份过程只读，不会停止、修改或恢复目标应用。</span></div><div className="mini-list">{target.map(t=><div className="mini-row" key={t.id}><div className="mini-main"><AppIcon app={t}/><div><div className="mini-name">{t.name}</div><div className="mini-meta">{t.deploy} · {t.size}</div></div></div><ModePill mode={t.mode}/></div>)}</div></div><div className="modal-foot"><button className="btn btn-secondary" onClick={close}>取消</button><button className="btn btn-primary" onClick={onContinue}>我已了解并继续 <Icon name="arrow" size={13}/></button></div></div></div> }
    function SessionModal({ close, showToast }) { return <div className="modal-backdrop" onMouseDown={e=>e.target===e.currentTarget&&close()}><div className="modal"><div className="modal-head"><div><div className="eyebrow" style={{marginBottom:6}}>Session · OIDC</div><div className="modal-title">林墨的登录会话</div><div className="modal-copy">当前会话绑定当前懒猫账号，切换账号后需要重新登录。</div></div><button className="icon-btn" onClick={close}><Icon name="close" size={15}/></button></div><div className="modal-body"><div className="notice good"><Icon name="shield" size={14}/><span>当前登录会话与懒猫账号一致。</span></div><div className="card card-pad" style={{boxShadow:'none',marginTop:13}}><div className="setting-row"><div><strong>显示名称</strong><p>林墨</p></div><span className="pill violet">NORMAL</span></div><div className="setting-row"><div><strong>UID</strong><p className="mono">uid-linmo-1001</p></div><Icon name="lock" size={14}/></div><div className="setting-row"><div><strong>会话到期</strong><p>今天 18:20 · 还剩 10 小时</p></div><span className="pill good">有效</span></div></div></div><div className="modal-foot"><button className="btn btn-secondary" onClick={()=>showToast('已退出登录','下次访问时会重新进入懒猫 OIDC。')}>退出登录</button><button className="btn btn-primary" onClick={()=>showToast('会话已刷新','已重新校验当前身份。')}>重新登录</button></div></div></div> }

    function App() {
      const [route,setRoute] = useState('applications');
      const [drawer,setDrawer] = useState(null);
      const [modal,setModal] = useState(null);
      const [toasts,setToasts] = useState([]);
      const [backupProgress,setBackupProgress] = useState(null);
      const navigate = r=>{setRoute(r); setDrawer(null); window.scrollTo({top:0,behavior:'smooth'});};
      const showToast = (title,copy)=>{const id=Date.now()+Math.random();setToasts(t=>[...t,{id,title,copy}]);setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),3600)};
      const startBackup = target => { const list=(Array.isArray(target)?target:[target]).filter(Boolean); const eligible=list.filter(a=>a.status.includes('BACKUPABLE')); if(!eligible.length){showToast('没有可备份目标','无数据或不支持数据库的实例不会创建 ZIP。');return;} const risk=eligible.filter(a=>a.mode==='single'); if(risk.length){setModal({type:'risk',target:eligible});return;} runBackup(eligible); };
      const runBackup = list => { setModal(null); setBackupProgress({targets:list,progress:8,phase:'身份与权限预检'}); let p=8; const timer=setInterval(()=>{p+=18; setBackupProgress(x=>x?{...x,progress:Math.min(p,100),phase:p<35?'解析 appvar 投影':p<60?'创建 SQLite 一致性快照':p<86?'流式写入 snapshot.zip': '写入 manifest.json 并完成提交'}:x); if(p>=100){clearInterval(timer);setTimeout(()=>{setBackupProgress(null);showToast('备份完成',`${list.map(a=>a.name).join('、')} 已写入当前用户网盘。`);},550)}},620); };
      const page = route==='applications'?<ApplicationsPage onOpenDetail={app=>setDrawer({type:'detail',app})} onBackup={startBackup} onPlan={targets=>setModal({type:'plan',targets:targets&&targets.map?targets.map(x=>typeof x==='string'?applications.find(a=>a.id===x):x):null})} showToast={showToast}/>:route==='overview'?<OverviewPage navigate={navigate} showToast={showToast}/>:route==='plans'?<PlansPage onPlan={targets=>setModal({type:'plan',targets})} showToast={showToast}/>:route==='tasks'?<TasksPage onTask={name=>setDrawer({type:'task',name})} showToast={showToast}/>:route==='backups'?<BackupsPage onSnapshot={snap=>setDrawer({type:'snapshot',snap})} showToast={showToast}/>:route==='storage'?<StoragePage showToast={showToast}/>:route==='alerts'?<AlertsPage showToast={showToast}/>:route==='settings'?<SettingsPage showToast={showToast}/>:<SetupPage navigate={navigate} showToast={showToast}/>;
      return <div className="app-shell"><Sidebar route={route} navigate={navigate} alertCount={alerts.length}/><div className="main"><Topbar navigate={navigate} onAlerts={()=>navigate('alerts')} onSession={()=>setModal({type:'session'})}/>{page}</div><MobileNavigation route={route} navigate={navigate} alertCount={alerts.length}/>{drawer?.type==='detail'&&<DetailDrawer app={drawer.app} close={()=>setDrawer(null)} onBackup={startBackup} onPlan={targets=>setModal({type:'plan',targets})} showToast={showToast}/>} {drawer?.type==='task'&&<TaskDrawer name={drawer.name} close={()=>setDrawer(null)}/>} {drawer?.type==='snapshot'&&<SnapshotDrawer snap={drawer.snap} close={()=>setDrawer(null)} showToast={showToast}/>} {modal?.type==='risk'&&<RiskModal target={modal.target} close={()=>setModal(null)} onContinue={()=>runBackup(modal.target)}/>} {modal?.type==='plan'&&<PlanModalSingle targets={modal.targets} close={()=>setModal(null)} showToast={showToast}/>} {modal?.type==='session'&&<SessionModal close={()=>setModal(null)} showToast={showToast}/>} {backupProgress&&<div className="modal-backdrop"><div className="modal"><div className="modal-head"><div><div className="eyebrow" style={{marginBottom:6}}>Backup job · {backupProgress.progress}%</div><div className="modal-title">猫猫正在把数据收进网盘</div><div className="modal-copy">{backupProgress.targets.map(a=>a.name).join('、')} · {backupProgress.phase}</div></div></div><div className="modal-body"><div className="progress" style={{height:12,marginTop:5}}><span style={{width:backupProgress.progress+'%'}}></span></div><div style={{display:'flex',justifyContent:'space-between',fontSize:10,color:'var(--ink-3)',marginTop:8}}><span>有界工作池 · 应用层只读</span><strong>{backupProgress.progress}%</strong></div><div className="mini-list" style={{marginTop:16}}>{['身份与权限预检','appvar 扫描与数据库检测','SQLite Online Backup','ZIP + SHA-256 + manifest'].map((s,i)=><div className="mini-row" key={s}><div className="mini-main"><div className="mini-icon" style={backupProgress.progress>=(i+1)*25?{background:'var(--mint-soft)',color:'var(--mint)'}:null}><Icon name={backupProgress.progress>=(i+1)*25?'check':'clock'} size={13}/></div><div><div className="mini-name">{s}</div><div className="mini-meta">{backupProgress.progress>=(i+1)*25?'已完成':i===Math.floor(backupProgress.progress/25)?'进行中':'等待中'}</div></div></div></div>)}</div></div></div></div>}<div className="toast-stack">{toasts.map(t=><div className="toast" key={t.id}><Icon name="check" size={15}/><div><strong>{t.title}</strong><p>{t.copy}</p></div></div>)}</div></div>;
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
